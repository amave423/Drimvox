      <stop offset="0" stop-color="#8b6fe0"/>
      <stop offset="1" stop-color="#3b7bd8"/>
    </linearGradient>
    <linearGradient id="drimvox-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4fc4"/>
      <stop offset="1" stop-color="#2a5fb0"/>
    </linearGradient>
    <linearGradient id="drimvox-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b19cf0"/>
      <stop offset="1" stop-color="#6fa2ea"/>
