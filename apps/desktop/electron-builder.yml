# Installers: Windows (NSIS, per user), Linux (AppImage and .deb). Releases go to GitHub, where the app looks for updates.
# Build with `npm run dist` (this computer's system) or let .github/workflows/release.yml build both on a version tag.
appId: com.drimvox.app
productName: Drimvox
copyright: Copyright © 2026 amave423
directories:
  output: release
  buildResources: build
# Main, preload and the core are bundled by esbuild: no node_modules goes into the app.
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  # Git for users without one (src/git-env.ts): dugite's build for this system.
  - from: ../../node_modules/dugite/git
    to: git
  # The tray's icon (src/tray.ts).
  - from: build/icon.png
    to: icon.png
asar: true
npmRebuild: false
nodeGypRebuild: false

win:
  target: nsis
  artifactName: Drimvox-Setup-${version}.${ext}
# A wizard rather than one click: where to install, a desktop shortcut, Ollama on the first start (build/installer.nsh),
# with Drimvox's own pictures. Per user, no administrator needed; Russian or English by the system's language.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Drimvox
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerLanguages:
    - ru_RU
    - en_US
  multiLanguageInstaller: true
  displayLanguageSelector: false

linux:
  target:
    - AppImage
    - deb
  # The package name (@drimvox/desktop) cannot name a file.
  executableName: drimvox
  category: Development
  maintainer: amave423 <artem123antropov@mail.ru>
  synopsis: A team of AI agents writes code under your review
  artifactName: Drimvox-${version}-${arch}.${ext}
deb:
  depends:
    - libnotify4
    - libxss1
    - libnss3

publish:
  provider: github
  owner: amave423
  repo: drimvox
  releaseType: release
