# A version tag (v0.2.0) builds the installers and publishes them as a GitHub release; installed apps update from it.
# Make the tag with `npm run release -- 0.2.0` after a green `npm run verify`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        run: test "v$(node -p "require('./apps/desktop/package.json').version")" = "$GITHUB_REF_NAME"
      # One release for both builds, so they do not race to create it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Artel ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # A fixed Ubuntu: the AppImage runs on systems no older than the one it was built on.
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w @artel/web && npm run build -w @artel/desktop
      - name: Build and upload the installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
