# The whole check on a Mac (docs/specs/macos.md): types, unit tests, the app built as a dmg, and the tests on a real
# window. Run by hand from the Actions tab (or `gh workflow run macos-check.yml`); the release builds the dmg itself.
name: macOS check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Build the app (dmg, not published)
        working-directory: apps/desktop
        run: npx electron-builder --mac --publish never
      - name: The screen
        run: system_profiler SPDisplaysDataType | grep -i resolution || true
      - run: npx playwright test
      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
      - name: Keep the dmg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drimvox-mac
          path: apps/desktop/release/*.dmg
          retention-days: 7
